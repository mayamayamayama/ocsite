<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARACTER DETAIL</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* ページ遷移用の黒い幕 */
    #page-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      z-index: 9999;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.loaded #page-overlay {
      opacity: 0;
    }

    body.is-exiting #page-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .container {
      max-width: 800px;
      width: 100%;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .back-btn {
      display: inline-block;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 25px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: #fff;
    }

    .profile-box {
      display: flex;
      gap: 30px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 30px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .profile-box {
        flex-direction: column;
        padding: 20px;
      }
    }

    .profile-img-container {
      flex: 1;
      background: #090909;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 550px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .profile-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .profile-tag {
      color: #e63946;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 20px;
      margin-bottom: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    .profile-desc {
      line-height: 1.8;
      color: #ccc;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .prompt-box {
      background-color: #080808;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      color: #8ab4f8;
      word-break: break-all;
      white-space: pre-wrap;
      margin: 0;
    }

    footer {
      margin-top: auto;
      padding-top: 20px;
      font-size: 0.7rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="page-overlay"></div>

  <div class="container">
    <a href="index.html" class="back-btn" id="back-btn">&larr; BACK TO INDEX</a>

    <div class="profile-box" id="profile-box"></div>
  </div>

  <footer>
    &copy; 2026 MY OC NOTE. ALL RIGHTS RESERVED.
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.body.classList.add('loaded');
    });

    // 戻るボタンを押した時もふわっと暗くなって遷移する
    const backBtn = document.getElementById('back-btn');
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.remove('loaded');
      document.body.classList.add('is-exiting');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 400);
    });

    const allCharacters = {
      "Barnard": {
        name: "Barnard",
        tag: "Male / Human",
        image: "Barnard.png",
        description: "筋骨隆々金髪外人の飄々気さくオジです。\n趣味は音楽制作と映画鑑賞です。\nプロンプトによっては上手く出力出来ない場合がありますので、随時改変してみてください。\n衣装は好きなだけ着脱させてください。",
        prompt: "boy, 1man,handsome,short blonde hair, slightly messy hair,blue eyes, sunglasses,white hoodie,baseball cap, headphones, watch,thick beard,goatee, dog tags,heavy stubble beard, scruffy chin beard, an incognito actor, cargo pants, ,sneakers,muscular, cool,black oversized jacket, layered distressed streetwear, multiple belts, silver chains, fingerless gloves, metallic accessories,dark Y2K punk aesthetic,bulky frame,An outfit with a well-balanced color scheme that avoids looking too dark,dark yellow and black backpack,A rugged, masculine face,smile,Cool and masculine eyes,A rugged, manly, handsome older man,High levels of male hormones,Body hair,The dignity and ruggedness of a mature man, devoid of any lingering traces of boyishness,Mature allure"
      },
      "Mele": {
        name: "Mele",
        tag: "Female / Human",
        image: "mele.png",
        description: "気弱なケモ耳少女です。\n一応絵描き設定です。\n可哀想は可愛いを信条に作られたため基本的にNGはないです。\n性格を出すために表情や姿勢に関するプロンプトが含まれているので、必要によって変更してください。",
        prompt: "girl, solo,blonde hair, medium hair, short hair, messy hair, hair bangs, red eyes, black midium size beret, beret, black oversized sweater, brown jacket, dog tags, pendant,white long bottoms,cork sandals,  (((timid))),((down-turned eyes)),-1.0::blush::,puzzled,-1.5::cool::,Slouching,lacking confidence,Drooping outer corners of the eyes,A bewildered look,Thin eyebrows,((Looks weak)),An anxious look on one's face,slightly open mouth,A slightly frightened look in one's eyes,((Looking down slightly)),-1.0::to thrust one's hands into one's pockets::,-0.5::Outward curl of hair::,Retaining a touch of childishness,Goat-like small Blonde ears,Eyes that do not open fully"
      }
    };

    const urlParams = new URLSearchParams(window.location.search);
    const charId = urlParams.get('id');
    const char = allCharacters[charId];

    const box = document.getElementById('profile-box');

    if (char) {
      document.title = `${char.name} - OC ARCHIVE`;
      box.innerHTML = `
        <div class="profile-img-container">
          <img class="profile-img" src="${char.image}" alt="${char.name}" oncontextmenu="return false;" ondragstart="return false;">
        </div>
        <div class="profile-info">
          <h1 class="profile-name">${char.name}</h1>
          <span class="profile-tag"># ${char.tag}</span>
          
          <div class="section-title">Story / Profile</div>
          <div class="profile-desc">${char.description}</div>
          
          <div class="section-title">Prompt / Tags</div>
          <pre class="prompt-box">${char.prompt}</pre>
        </div>
      `;
    } else {
      box.innerHTML = `<p style="color: #888; text-align:center; width:100%;">キャラクターデータが見つかりませんでした。</p>`;
    }
  </script>

</body>
</html>
