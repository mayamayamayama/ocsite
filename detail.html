<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHARACTER DETAIL</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 800px;
      width: 100%;
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .back-btn {
      display: inline-block;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 25px;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: #fff;
    }

    /* 詳細ページのレイアウト（PCでは横並び、スマホでは縦並び） */
    .profile-box {
      display: flex;
      gap: 30px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 30px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      .profile-box {
        flex-direction: column;
        padding: 20px;
      }
    }

    .profile-img-container {
      flex: 1;
      background: #090909;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 550px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* イラスト全体を綺麗に表示 */
    }

    .profile-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .profile-name {
      font-size: 2rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .profile-tag {
      color: #e63946;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 20px;
      margin-bottom: 8px;
      border-bottom: 1px solid #222;
      padding-bottom: 4px;
    }

    .profile-desc {
      line-height: 1.8;
      color: #ccc;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .prompt-box {
      background-color: #080808;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      color: #8ab4f8;
      word-break: break-all;
      white-space: pre-wrap;
      margin: 0;
    }

    footer {
      margin-top: auto;
      padding-top: 20px;
      font-size: 0.7rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="back-btn">&larr; BACK TO INDEX</a>

    <div class="profile-box" id="profile-box">
      <!-- JavaScriptでここにデータが読み込まれます -->
    </div>
  </div>

  <footer>
    &copy; 2026 MY OC NOTE. ALL RIGHTS RESERVED.
  </footer>

  <script>
    /* ========================================================
       ★ キャラクターの詳細データ（ここを編集して増やせます）
    ======================================================== */
    const allCharacters = {
      "mele": {
        name: "メレ",
        tag: "BRAIN WORLD / MEMORY",
        image: "mele.png",
        description: "ここにメレの詳細なストーリーや設定を入力できます。\n改行もそのまま反映されます。",
        prompt: "1boy, solo, white hair, glowing eyes, dark atmosphere"
      },
      "rouki": {
        name: "狼鬼",
        tag: "WOLF / NINJA",
        image: "rouki.png",
        description: "ここに狼鬼の詳細なプロファイルを入力できます。",
        prompt: "1boy, wolf ears, wolf tail, ninja costume"
      }
    };

    /* --- URLからIDを読み取って該当キャラを表示する処理 --- */
    const urlParams = new URLSearchParams(window.location.search);
    const charId = urlParams.get('id');
    const char = allCharacters[charId];

    const box = document.getElementById('profile-box');

    if (char) {
      document.title = `${char.name} - OC ARCHIVE`;
      box.innerHTML = `
        <div class="profile-img-container">
          <img class="profile-img" src="${char.image}" alt="${char.name}">
        </div>
        <div class="profile-info">
          <h1 class="profile-name">${char.name}</h1>
          <span class="profile-tag"># ${char.tag}</span>
          
          <div class="section-title">Story / Profile</div>
          <div class="profile-desc">${char.description}</div>
          
          <div class="section-title">Prompt / Tags</div>
          <pre class="prompt-box">${char.prompt}</pre>
        </div>
      `;
    } else {
      box.innerHTML = `<p style="color: #888; text-align:center; width:100%;">キャラクターデータが見つかりませんでした。</p>`;
    }
  </script>

</body>
</html>
