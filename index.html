 <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      margin-top: 40px;
      margin-bottom: 40px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: #ffffff;
      margin: 0;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #777;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
    }

    /* 画像が切れないように全体を表示する設定 */
    .card-img-container {
      width: 100%;
      height: 320px;
      background-color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* 見切れずに全体が収まるようにする */
    }

    .card-info {
      padding: 15px;
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      background-color: #262626;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 5px;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.7rem;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>OC ARCHIVE</h1>
    <div class="subtitle">CHARACTER INDEX / VOL. 01</div>
  </header>

  <main class="character-grid" id="character-grid"></main>

  <footer>
    &copy; 2026 MY OC NOTE. ALL RIGHTS RESERVED.
  </footer>

  <script>
    /* ========================================================
       ★ キャラクターデータ一覧
       detail.html?id=001 のように各専用ページへ飛ぶ仕組みです
    ======================================================== */
    const characters = [
      {
        id: "mele",
        name: "メレ",
        tag: "BRAIN WORLD / MEMORY",
        image: "mele.png", // あなたの画像ファイル名
      },
      {
        id: "rouki",
        name: "狼鬼",
        tag: "WOLF / NINJA",
        image: "rouki.png", // 狼鬼の画像ファイル名（あれば）
      }
    ];

    const grid = document.getElementById('character-grid');

    characters.forEach(char => {
      const card = document.createElement('a');
      card.className = 'card';
      // クリックしたら詳細ページにIDと一緒に飛ぶ
      card.href = `detail.html?id=${char.id}`;

      card.innerHTML = `
        <div class="card-img-container">
          <img class="card-img" src="${char.image}" alt="${char.name}">
        </div>
        <div class="card-info">
          <h2 class="card-name">${char.name}</h2>
          <span class="card-tag"># ${char.tag}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
