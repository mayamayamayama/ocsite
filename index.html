<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE // SYSTEM.01</title>
  <!-- Three.jsの読み込み（WebGLをゴリゴリ動かすための最強ライブラリ） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-color: #080808;
      --card-bg: rgba(20, 20, 20, 0.75);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-color: #ff3366;
      --text-main: #f0f0f0;
      --text-sub: #888;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    /* --- 背景の3D（WebGL）キャンバスを固定 --- */
    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; /* コンテンツの奥に配置 */
      pointer-events: none; /* マウスイベントを透過させる */
    }

    /* --- メインコンテンツのレイアウト --- */
    .site-wrapper {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      margin-top: 20px;
      margin-bottom: 50px;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(10, 10, 10, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 0.3em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--accent-color);
      margin-top: 10px;
      letter-spacing: 0.2em;
      font-weight: bold;
    }

    /* グリッドレイアウト（スマホ2列、PC4列） */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    @media (min-width: 768px) {
      .character-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
      }
    }

    /* ガラスモフィズム仕様のカード */
    .card {
      background-color: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 40px rgba(255, 51, 102, 0.2);
    }

    .card-img-container {
      width: 100%;
      height: 280px;
      background-color: #050505;
      overflow: hidden;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .card:hover .card-img {
      transform: scale(1.08); /* ホバー時にじわっと拡大 */
    }

    .card-info {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.4);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 6px 0;
      letter-spacing: 0.05em;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.68rem;
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    footer {
      margin-top: auto;
      padding-top: 60px;
      padding-bottom: 20px;
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 背景でWebGL（3D）がゴリゴリ動くコンテナ -->
  <div id="webgl-container"></div>

  <div class="site-wrapper">
    <header>
      <h1>OC ARCHIVE</h1>
      <div class="subtitle">// SYSTEM ACTIVE : VER. 2.0</div>
    </header>

    <main class="character-grid" id="character-grid"></main>

    <footer>
      &copy; 2026 MY OC ARCHIVE. ALL RIGHTS RESERVED.
    </footer>
  </div>

  <script>
    /* ========================================================
       ★ キャラクターデータ一覧（ここにキャラを追加できます）
    ======================================================== */
    const characters = [
      {
        id: "Barnard",
        name: "Barnard",
        tag: "Male / Human",
        image: "Barnard.png",
      },
      {
        id: "Mele",
        name: "Mele",
        tag: "Female / Human",
        image: "mele.png",
      }
    ];

    const grid = document.getElementById('character-grid');

    characters.forEach(char => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `detail.html?id=${char.id}`;

      card.innerHTML = `
        <div class="card-img-container">
          <img class="card-img" src="${char.image}" alt="${char.name}" oncontextmenu="return false;" ondragstart="return false;">
        </div>
        <div class="card-info">
          <h2 class="card-name">${char.name}</h2>
          <span class="card-tag"># ${char.tag}</span>
        </div>
      `;
      grid.appendChild(card);
    });

    /* ========================================================
       ★ WebGL (Three.js) 背景演出エンジン
       junniサイトのようなメタリック＆ガラス質の3Dオブジェクトを配置
    ======================================================== */
    const container = document.getElementById('webgl-container');

    // シーン、カメラ、レンダラーの作成
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 光源の配置（メタリックな質感を出すために複数のライトを当てる）
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const pointLight1 = new THREE.PointLight(0xff3366, 30, 50);
    pointLight1.position.set(5, 5, 5);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x3366ff, 30, 50);
    pointLight2.position.set(-5, -5, 5);
    scene.add(pointLight2);

    // メタリック＆ガラス風の少し歪んだ3Dオブジェクト（トーラス・ノット）を作成
    const geometry = new THREE.TorusKnotGeometry(3.5, 1.1, 128, 32);
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x111111,
      metalness: 0.9,
      roughness: 0.15,
      transmission: 0.6, // ガラスのような透過感
      ior: 2.5,          // 屈折率
      wireframe: false
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // マウス位置の追従用変数
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - window.innerWidth / 2) * 0.002;
      mouseY = (event.clientY - window.innerHeight / 2) * 0.002;
    });

    // アニメーションループ（毎フレーム3Dを回転＆マウスに反応させる）
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // 緩やかにマウス位置へ追従（イージング）
      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      // オブジェクトの回転と変形
      mesh.rotation.x = elapsedTime * 0.2 + targetY;
      mesh.rotation.y = elapsedTime * 0.3 + targetX;

      renderer.render(scene, camera);
    }

    animate();

    // 画面サイズ変更への対応
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
