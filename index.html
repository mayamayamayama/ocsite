<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE</title>
  <style>
    /* 全体の基本デザイン（ダークモード） */
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      margin-top: 40px;
      margin-bottom: 40px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: #ffffff;
      margin: 0;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    /* キャラクター一覧のコンテナ */
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    /* キャラクターカードのデザイン */
    .card {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #666;
    }

    .card-img-placeholder {
      width: 100%;
      height: 280px;
      background-color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 0.9rem;
    }

    .card-info {
      padding: 15px;
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      background-color: #262626;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 5px;
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      font-size: 0.7rem;
      color: #444;
    }
  </style>
</head>
<body>

  <header>
    <h1>OC ARCHIVE</h1>
    <div class="subtitle">CHARACTER INDEX / VOL. 01</div>
  </header>

  <main class="character-grid">
    <!-- サンプルキャラクター1 -->
    <div class="card">
      <div class="card-img-placeholder">IMAGE NO IMAGE</div>
      <div class="card-info">
        <h2 class="card-name">CHARACTER 01</h2>
        <span class="card-tag">#TAG_NAME</span>
      </div>
    </div>

    <!-- サンプルキャラクター2 -->
    <div class="card">
      <div class="card-img-placeholder">IMAGE NO IMAGE</div>
      <div class="card-info">
        <h2 class="card-name">CHARACTER 02</h2>
        <span class="card-tag">#TAG_NAME</span>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 MY OC NOTE. ALL RIGHTS RESERVED.
  </footer>

</body>
</html>
