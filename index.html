<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>OC ARCHIVE</h1>
    <div class="subtitle">CHARACTER INDEX / VOL. 01</div>
  </header>

  <main class="character-grid" id="character-grid">
    <!-- Barnard -->
    <div class="card" onclick="openDetail('Barnard')">
      <div class="card-img-container">
        <img class="card-img" src="Barnard.png" alt="Barnard" oncontextmenu="return false;" ondragstart="return false;">
      </div>
      <div class="card-info">
        <h2 class="card-name">Barnard</h2>
        <span class="card-tag"># Male / Human</span>
      </div>
    </div>

    <!-- Mele -->
    <div class="card" onclick="openDetail('Mele')">
      <div class="card-img-container">
        <img class="card-img" src="mele.png" alt="Mele" oncontextmenu="return false;" ondragstart="return false;">
      </div>
      <div class="card-info">
        <h2 class="card-name">Mele</h2>
        <span class="card-tag"># Female / Human</span>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 MY OC NOTE. ALL RIGHTS RESERVED.
  </footer>

  <!-- 詳細画面オーバーレイ -->
  <div id="detail-overlay" onclick="closeDetail(event)">
    <div class="container" onclick="event.stopPropagation()">
      <button class="back-btn" onclick="closeDetail()">&larr; BACK TO INDEX</button>
      <div class="profile-box" id="profile-box"></div>
    </div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
