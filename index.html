<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE // VIVID EDITION</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-color: #050508;
      --card-bg: rgba(15, 15, 22, 0.65);
      --border-color: rgba(255, 255, 255, 0.18);
      --accent-color: #ff0055;
      --text-main: #ffffff;
      --text-sub: #a0a0b0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    #webgl-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    .site-wrapper {
      position: relative;
      z-index: 1;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      margin-top: 20px;
      margin-bottom: 50px;
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 24px 48px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: rgba(10, 10, 15, 0.4);
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.15);
    }

    h1 {
      font-size: 2.3rem;
      letter-spacing: 0.35em;
      color: #fff;
      margin: 0;
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
    }

    .subtitle {
      font-size: 0.75rem;
      color: #00ffff;
      margin-top: 10px;
      letter-spacing: 0.25em;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    @media (min-width: 768px) {
      .character-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 30px;
      }
    }

    .card {
      background-color: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: #00ffff;
      box-shadow: 0 12px 40px rgba(0, 255, 255, 0.25);
    }

    .card-img-container {
      width: 100%;
      height: 280px;
      background-color: #08080c;
      overflow: hidden;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .card:hover .card-img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 16px;
      border-top: 1px solid var(--border-color);
      background: rgba(5, 5, 8, 0.6);
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 6px 0;
      letter-spacing: 0.05em;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.68rem;
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-sub);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    footer {
      margin-top: auto;
      padding-top: 60px;
      padding-bottom: 20px;
      font-size: 0.7rem;
      color: var(--text-sub);
      letter-spacing: 0.1em;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="site-wrapper">
    <header>
      <h1>OC ARCHIVE</h1>
      <div class="subtitle">// VIVID NEON : SYSTEM ACTIVE</div>
    </header>

    <main class="character-grid" id="character-grid"></main>

    <footer>
      &copy; 2026 MY OC ARCHIVE. ALL RIGHTS RESERVED.
    </footer>
  </div>

  <script>
    const characters = [
      {
        id: "Barnard",
        name: "Barnard",
        tag: "Male / Human",
        image: "Barnard.png",
      },
      {
        id: "Mele",
        name: "Mele",
        tag: "Female / Human",
        image: "mele.png",
      }
    ];

    const grid = document.getElementById('character-grid');

    characters.forEach(char => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = `detail.html?id=${char.id}`;

      card.innerHTML = `
        <div class="card-img-container">
          <img class="card-img" src="${char.image}" alt="${char.name}" oncontextmenu="return false;" ondragstart="return false;">
        </div>
        <div class="card-info">
          <h2 class="card-name">${char.name}</h2>
          <span class="card-tag"># ${char.tag}</span>
        </div>
      `;
      grid.appendChild(card);
    });

    /* ========================================================
       ★ ビビット＆ネオン仕様の Three.js 背景演出
    ======================================================== */
    const container = document.getElementById('webgl-container');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 14;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // 環境光を少し明るくして全体を持ち上げる
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
    scene.add(ambientLight);

    // 強烈なビビットカラーのポイントライト（マゼンタ ＆ シアン）
    const pointLight1 = new THREE.PointLight(0xff0055, 50, 60);
    pointLight1.position.set(6, 6, 6);
    scene.add(pointLight1);

    const pointLight2 = new THREE.PointLight(0x00ffff, 50, 60);
    pointLight2.position.set(-6, -6, 6);
    scene.add(pointLight2);

    // 形状を少しダイナミックにしてガラス＆メタリックの質感を向上
    const geometry = new THREE.TorusKnotGeometry(3.2, 1.0, 128, 32);
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x222233,
      metalness: 0.95,
      roughness: 0.1,
      transmission: 0.8,
      ior: 2.3,
      reflectivity: 1.0
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX - window.innerWidth / 2) * 0.0025;
      mouseY = (event.clientY - window.innerHeight / 2) * 0.0025;
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;

      mesh.rotation.x = elapsedTime * 0.25 + targetY;
      mesh.rotation.y = elapsedTime * 0.35 + targetX;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>

</body>
</html>
