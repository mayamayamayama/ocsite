<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC ARCHIVE</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* --- ページ遷移用の黒い幕（トランジション用） --- */
    #page-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0d0d;
      z-index: 9999;
      pointer-events: none;
      opacity: 1; /* 初期状態は真っ黒 */
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ページ読み込み完了後に幕を明ける */
    body.loaded #page-overlay {
      opacity: 0;
    }

    /* 遷移時に幕を閉じる */
    body.is-exiting #page-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- ふわっと現れるアニメーションの定義 --- */
    @keyframes fadeInSlide {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      margin-top: 40px;
      margin-bottom: 40px;
      text-align: center;
      animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: #ffffff;
      margin: 0;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
      letter-spacing: 0.1em;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, box-shadow 0.3s;
      
      opacity: 0;
      animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.35s; }
    .card:nth-child(3) { animation-delay: 0.5s; }
    .card:nth-child(4) { animation-delay: 0.65s; }

    .card:hover {
      transform: translateY(-6px);
      border-color: #666;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.03);
    }

    .card-img-container {
      width: 100%;
      height: 320px;
      background-color: #111;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .card:hover .card-img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 15px;
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin: 0 0 5px 0;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      background-color: #262626;
      color: #aaa;
      padding: 3px 8px;
      border-radius: 4px;
      margin-top: 5px;
    }

    footer {
      margin-top: auto;
      padding-top: 60px;
      padding-bottom: 20px;
      font-size: 0.7rem;
      color: #444;
      text-align: center;
      animation: fadeInSlide 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.8s;
      opacity: 0;
    }
  </style>
</head>
