<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>サウンドトラック - OC ARCHIVE</title>
  <meta name="description" content="MAYAMA BOOMBOX — キャラクターたちの曲を、カセットテープで。">
  <!-- 電車で来たときは、最初から電車で画面をおおっておく（nav.js が動かします） -->
  <script>
    (function () {
      try { var g = JSON.parse(sessionStorage.getItem('nv-go')); if (g && Date.now() - g.t < 15000) { var h = document.documentElement; h.classList.add('nv-arrive'); setTimeout(function () { h.classList.remove('nv-arrive'); }, 5000); } } catch (e) {}
    })();
  </script>
  <!-- 3D の部品（three.js）の場所。boom3d.js が使います（index.html と同じ番号） -->
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css?v=70">
  <link rel="stylesheet" href="boom.css?v=70">
</head>
<body class="bx">
  <div class="bx-wrap">
    <header class="bx-head">
      <p class="bx-kicker">OC ARCHIVE — GALLERY 05</p>
      <h1 class="bx-title">Sound<span>track</span></h1>
      <p class="bx-sub">サウンドトラック<i>SIDE A / SIDE B</i></p>
    </header>

    <!-- ラジカセ（3D は boom3d.js）。左右にスワイプしてテープを選び、まん中のテープをタップすると再生 -->
    <div class="bx-stage" id="bx-stage"><canvas aria-label="ラジカセとカセットテープ。左右にスワイプしてテープを選び、まん中のテープをタップすると再生します"></canvas><p class="bx-hint">← SWIPE →　·　TAP THE TAPE</p></div>
    <div class="bx-deck">
      <div class="bx-keys"><button type="button" class="bx-key" id="bx-prev" aria-label="前のテープ">◀&#xFE0E;◀&#xFE0E;</button><button type="button" class="bx-key big" id="bx-play">▶&#xFE0E; PLAY</button><button type="button" class="bx-key" id="bx-next" aria-label="次のテープ">▶&#xFE0E;▶&#xFE0E;</button></div>
      <div class="bx-side">SIDE<div class="bx-sw"><button type="button" id="bx-a" aria-label="A面">A</button><button type="button" id="bx-b" aria-label="B面">B</button></div></div>
    </div>

    <!-- 今のテープ（J カード）と、曲のプレーヤー -->
    <section class="bx-card" id="bx-now">
      <p class="bx-card-top"><span id="bx-state">SELECTED</span><b id="bx-no"></b></p>
      <h2 class="bx-name" id="bx-name"></h2>
      <div id="bx-tracks"></div>
      <p class="bx-note" id="bx-note"></p>
      <div id="bx-player"></div>
    </section>

    <section class="bx-sel">
      <p class="bx-label">TAPES — テープをえらぶ</p>
      <div class="bx-list" id="bx-list"></div>
    </section>

    <p class="bx-foot">MAYAMA TAPES · TYPE II · 60 MIN<br>© OC ARCHIVE</p>
  </div>

  <!-- editor.js（キャラクター）が使う場所。このページでは見えません -->
  <div id="character-grid" hidden></div><button type="button" id="back-btn" hidden></button>

  <script src="nav.js?v=70"></script>
  <script src="editor.js"></script>
  <script src="sound.js?v=70"></script>
  <script src="boom.js?v=70"></script>
  <script src="boom-art.js?v=70"></script>
  <script src="boom3d.js?v=70"></script>
</body>
</html>
